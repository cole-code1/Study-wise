<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dental AI Assistant Test</title>
    <style>
        body { font-family: sans-serif; background-color: #f1f5f9; padding: 40px; display: flex; flex-direction: column; align-items: center; }
        .chat-container { width: 400px; height: 500px; bg: white; background: #ffffff; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); display: flex; flex-direction: column; overflow: hidden; border: 1px solid #e2e8f0; }
        .chat-header { background: #2563eb; color: white; padding: 15px; font-weight: bold; }
        .chat-messages { flex-1; flex-grow: 1; padding: 15px; overflow-y: auto; background: #f8fafc; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 10px 14px; rounded-radius: 8px; border-radius: 8px; max-w: 80%; font-size: 14px; line-height: 1.4; }
        .msg.user { background: #2563eb; color: white; align-self: flex-end; border-top-right-radius: 0; }
        .msg.ai { background: #e2e8f0; color: #1e293b; align-self: flex-start; border-top-left-radius: 0; }
        .chat-input-area { padding: 12px; border-top: 1px solid #e2e8f0; display: flex; gap: 8px; background: white; }
        .chat-input { flex-grow: 1; padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 6px; outline: none; }
        .chat-btn { background: #2563eb; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 500; }
        .chat-btn:hover { background: #1d4ed8; }
    </style>
</head>
<body>

    <p style="color: #64748b; margin-bottom: 20px; font-size: 14px;">Chat directly with your Dental AI Assistant.</p>

    <div class="chat-container">
        <div class="chat-header">Dental AI Assistant</div>
        <div id="chat-messages" class="chat-messages">
            <div class="msg ai">Hello! How can I help you with your dental appointment today?</div>
        </div>
        <div class="chat-input-area">
            <input id="chat-input" type="text" placeholder="Type your message..." class="chat-input">
            <button onclick="sendMessage()" class="chat-btn">Send</button>
        </div>
    </div>
        <h5 style="color: #1e293b; margin-bottom: 5px;">powered by</h5>
        <img src="https://res.cloudinary.com/daqtttdb0/image/upload/v1768241458/Navy_and_White_Modern_Book_Club_Logo_20260107_171021_0000-removebg-preview_rj8yf3.png" alt="Dental Clinic Logo" style="width: 100px; height: 100px; margin-bottom: 20px;">
    

    <script>
        // PASTE YOUR MAKE.COM WEBHOOK URL HERE
const MAKE_WEBHOOK_URL = "https://hook.us2.make.com/q4bao14fbn6y8a0m8q2ypdijq1o57kqy";

async function sendMessage() {
    const inputEl = document.getElementById('chat-input');
    const messagesContainer = document.getElementById('chat-messages');
    const text = inputEl.value.trim();

    if (!text) return;

    // 1. Append user text
    appendMessage(text, 'user');
    inputEl.value = '';

    // 2. Append typing placeholder
    const typingId = appendMessage('...', 'ai');

    try {
        const response = await fetch(MAKE_WEBHOOK_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: text })
        });

        // FIX: Read response as plain text since your Webhook Response outputs text directly
        const aiResponseText = await response.text();
        
        // Update placeholder with actual Gemini response text
        document.getElementById(typingId).innerText = aiResponseText;
    } catch (error) {
        document.getElementById(typingId).innerText = "Error pulling response. Check your Make configuration.";
    }
}

function appendMessage(text, sender) {
    const messagesContainer = document.getElementById('chat-messages');
    const msgDiv = document.createElement('div');
    const id = 'msg-' + Date.now();
    msgDiv.id = id;
    msgDiv.className = `msg ${sender}`;
    msgDiv.innerText = text;
    messagesContainer.appendChild(msgDiv);
    messagesContainer.scrollTop = messagesContainer.scrollHeight;
    return id;
}
    </script>
</body>
</html>
